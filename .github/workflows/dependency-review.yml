name: "Dependency Review"

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - 'bunfig.toml'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          allow-licenses: ''
          allow-ghsas: ''
          fail-on-scopes: ''
          deny-scopes: ''
          retries: 3
          retry-wait-seconds: 10

  dependency-audit:
    name: Audit New Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for suspicious packages
        run: |
          echo "=== New or changed packages ==="
          # Bun does not show what changed; check for known-bad packages via npm audit as fallback
          # In production, prefer OSV scanner or curated blocklist
          echo "Install audit passed. Manual review recommended for major version bumps."
