name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'  # Lunes 6:00 UTC = 8:00 Madrid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@29c9f31e4a3ad4f169bbfaf78a3fcbba9569e275
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
