name: Dependency Security Audit

on:
  schedule:
    - cron: '0 7 * * 1'  # Lunes 7:00 UTC = 9:00 Madrid (1h después de Renovate)
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'package-lock.json'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@fa4ff678dd5d0a4fa3d628e57af8162873e93cd6
        with:
          scan-args: |
            --recursive
            --format=sarif
            --output=results.sarif
            ./

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6bb031afdd865eb6b2e0f6d8691b8ce700b6f9e7
        with:
          sarif_file: results.sarif
