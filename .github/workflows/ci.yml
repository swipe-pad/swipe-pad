name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run static checks
        run: bun run check

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  e2e-tests:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (only if test:e2e uses Playwright)
        # The current e2e test uses bun test + fetch only (no browser).
        # Uncomment if you add Playwright-based UI tests.
        # For local runs, use `bun run test:ui:e2e` (needs chromium from Nix devShell).
        # For CI on GitHub, this step is fast on the real runner.
        run: |
          if grep -q "from \"playwright" src/test/*.test.ts 2>/dev/null; then
            bunx playwright install --with-deps chromium-headless-shell
          else
            echo "No Playwright usage in e2e tests, skipping browser install"
          fi

      - name: Run E2E tests
        run: bun run test:e2e

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: cd contracts && forge build

      - name: Test contracts
        run: cd contracts && forge test
