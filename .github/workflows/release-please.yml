name: "Release Please"

on:
  workflow_dispatch:
  schedule:
    # Weekly on Tuesday at 10:00 UTC
    - cron: '0 10 * * 2'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Release Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: node
          package-name: swipe-pad-app
          version-file: package.json
          changelog-path: CHANGELOG.md
          default-branch: main
          prerelease: false
          # Only create PRs, do not auto-merge
          auto-publish: false
          # Group commits by type
          group-pull-request-title-pattern: 'feat: ${version}'
          # Handle chore/fix grouping
          separate-major-minor: false
          include-v-in-tag: true
          git-message: "chore: release v{{version}}"

      - name: Check release please result
        if: steps.release.outputs.pr_created == 'true'
        run: |
          echo "Release PR created or updated."
          echo "PR number: ${{ steps.release.outputs.pr_number }}"
          echo "Release version: ${{ steps.release.outputs.version }}"
