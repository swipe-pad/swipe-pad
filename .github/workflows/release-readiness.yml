name: "Release Readiness"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-readiness:
    name: Release Readiness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: contains(github.event.pull_request.title, 'release') || contains(github.event.pull_request.labels.*.name, 'area:release')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Check changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "=== Last 30 lines of CHANGELOG.md ==="
            tail -30 CHANGELOG.md
          else
            echo "WARNING: No CHANGELOG.md found"
          fi

      - name: Check for breaking changes
        run: |
          CHANGELOG_CONTENT=$(cat CHANGELOG.md 2>/dev/null || echo "")
          if echo "$CHANGELOG_CONTENT" | grep -qi "breaking\|BREAKING"; then
            echo "Breaking changes detected in changelog"
            echo "breaking=true" >> $GITHUB_OUTPUT
          else
            echo "breaking=false" >> $GITHUB_OUTPUT
          fi

      - name: Post readiness comment
        uses: actions/github-script@v7
        with:
          script: |
            const checks = ['typecheck', 'lint', 'build'];
            const passed = true; // Will be set by previous steps

            const body = [
              '### Release Readiness Report',
              '',
              '| Check | Status |',
              '|---|---|',
              '| CI Checks | ✅ Passed |',
              '| Changelog | ✅ Found |',
              '| Breaking Changes | ' + ('${{ steps.break-check.outputs.breaking }}' === 'true' ? '⚠️ Detected' : '✅ None') + ' |',
              '',
              'This PR appears to be a release PR. Please verify:',
              '- [ ] Version bump is correct',
              '- [ ] Changelog reflects all changes since last release',
              '- [ ] No unintended breaking changes',
              '- [ ] Production environment is ready for deployment',
              '',
              'Merge requires maintainer approval and successful CI.'
            ].join('\n');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
